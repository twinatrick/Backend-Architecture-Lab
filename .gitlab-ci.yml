stages:
  - test
  - integration
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2 -Xms256m -Xmx1024m -XX:+UseG1GC"
  PIP_CACHE_DIR: "/root/.cache/pip"

# ============================================
# Job 1：Maven 單元測試與代碼覆蓋率
# ============================================
java-unit-test:
  stage: test
  image: maven:3.9.8-eclipse-temurin-21
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw test jacoco:check -B
    - |
      if [ -n "$SONAR_TOKEN" ]; then
        echo "Running SonarQube Scanner..."
        ./mvnw sonar:sonar \
          -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
          -Dsonar.token="${SONAR_TOKEN}"
      else
        echo "SONAR_TOKEN not set, skipping SonarQube analysis."
      fi
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/*.xml"
    paths:
      - "target/site/jacoco/"
    expire_in: 7 days

# ============================================
# Job 2：Python 服務靜態檢查與 Pytest
# ============================================
python-verify:
  stage: test
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff pytest httpx fastapi pydantic-settings python-multipart requests av minio nacos-sdk-python==2.0.11 opencc soundfile numpy
  script:
    - ruff check backend-ai-py
    - ruff format --check backend-ai-py
    - cd backend-ai-py && pytest

# ============================================
# Job 3：Testcontainers 端到端整合測試 (自動執行門禁)
# ============================================
testcontainers-integration:
  stage: integration
  image: maven:3.9.8-eclipse-temurin-21
  variables:
    DOCKER_API_VERSION: "1.44"
    TESTCONTAINERS_HOST_OVERRIDE: "172.17.0.1"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2 -Xms512m -Xmx2048m -XX:+UseG1GC"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: false
  before_script:
    - chmod +x mvnw
    - echo "api.version=1.44" > /root/.docker-java.properties
  script:
    - ./mvnw verify -Pintegration-test -Dsurefire.skip=true -Dapi.version=1.44 -B
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/failsafe-reports/*.xml"
    paths:
      - "**/target/failsafe-reports/"
    expire_in: 7 days

# ============================================
# Job 4：全量微服務 Docker Image 建置
# ============================================
docker-images-build:
  stage: package
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: manual
      allow_failure: true
  script:
    - echo "===> Building all microservice Docker images with --no-cache (Gateway + 5 microservices)..."
    - docker compose -f compose.prototype.yaml build --no-cache
    - docker images | grep backend-architecture-lab-

# ============================================
# Job 5：微服務叢集部署 (master 自動部署)
# ============================================
deploy-cluster:
  stage: deploy
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: manual
      allow_failure: true
  script:
    - echo "===> Starting middleware services (PostgreSQL, Redis, Kafka, Zookeeper, Nacos, MinIO)..."
    - docker compose -f compose.prototype.yaml up -d postgres redis nacos zookeeper kafka minio
    - echo "===> Waiting for PostgreSQL readiness and ensuring business databases exist..."
    - |
      for i in $(seq 1 30); do
        PG_STATUS=$(docker inspect -f '{{.State.Health.Status}}' backend-architecture-lab-postgres 2>/dev/null || echo "starting")
        if [ "$PG_STATUS" = "healthy" ]; then
          echo "PostgreSQL is ready! Ensuring 5 business databases exist..."
          docker exec -i backend-architecture-lab-postgres createdb -U postgres iam_service || true
          docker exec -i backend-architecture-lab-postgres createdb -U postgres competency_service || true
          docker exec -i backend-architecture-lab-postgres createdb -U postgres job_service || true
          docker exec -i backend-architecture-lab-postgres createdb -U postgres external_api_service || true
          docker exec -i backend-architecture-lab-postgres createdb -U postgres alert_service || true
          break
        fi
        sleep 2
      done
    - echo "===> Checking Nacos readiness..."
    - |
      for i in $(seq 1 30); do
        NACOS_STATUS=$(docker inspect -f '{{.State.Health.Status}}' backend-architecture-lab-nacos 2>/dev/null || echo "starting")
        if [ "$NACOS_STATUS" = "healthy" ] || docker exec backend-architecture-lab-nacos curl -fsS http://localhost:8848/nacos/v1/console/health/readiness >/dev/null 2>&1; then
          echo "Nacos is healthy and ready!"
          break
        fi
        echo "Waiting for Nacos readiness ($i/30)..."
        sleep 2
      done
    - echo "===> Deploying microservices with latest images (force-recreate, no-deps)..."
    - docker compose -f compose.prototype.yaml up -d --force-recreate --no-deps gateway iam-service competency-service job-service external-api-service alert-service
    - echo "===> Waiting for Gateway readiness..."
    - |
      for i in $(seq 1 30); do
        GW_STATUS=$(docker inspect -f '{{.State.Status}}' backend-architecture-lab-gateway 2>/dev/null || echo "down")
        if [ "$GW_STATUS" = "running" ]; then
          echo "backend-architecture-lab-gateway container is running!"
          break
        fi
        sleep 1
      done
    - docker ps --filter "name=backend-architecture-lab-"
    - echo "===> Service log summary (Gateway):"
    - docker logs --tail 25 backend-architecture-lab-gateway
    - echo "===> Microservice cluster deployment complete!"
