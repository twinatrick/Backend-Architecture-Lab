workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - prepare
  - test
  - integration
  - package
  - deploy

variables:
  GIT_DEPTH: "0"
  MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2 -Xms256m -Xmx1024m -XX:+UseG1GC"
  PIP_CACHE_DIR: "/root/.cache/pip"

# ============================================
# Stage 0：共通變更影響範圍判定 (Impact-Scoped Verification)
# ============================================
impact-scope:
  stage: prepare
  image: python:3.11-slim@sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60
  script:
    - bash scripts/ci/run_impact_scope.sh
  artifacts:
    when: always
    reports:
      dotenv: .ci-artifacts/impact.env
    paths:
      - .ci-artifacts/impact_report.json
      - .ci-artifacts/impact.env
    expire_in: 7 days

# ============================================
# 平台專屬驗證：以替身命令驗證 Portainer 部署契約
# ============================================
portainer-deploy-contract-test:
  stage: test
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache bash jq
    - pip install --no-cache-dir PyYAML==6.0.2
  script:
    - python scripts/test_portainer_ci.py

# ============================================
# Job 1：共通 Java 單元測試 + JaCoCo 覆蓋率門檻 + 條件式 Sonar
# ============================================
java-unit-test:
  stage: test
  image: maven:3.9.8-eclipse-temurin-21@sha256:de18e4e51396ad9266f76669779ed6d6b49fbb0f45ed6f39169d87378d548d7d
  needs:
    - job: impact-scope
      artifacts: true
  script:
    - bash scripts/ci/verify_java_unit.sh
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/*.xml"
    paths:
      - "**/target/surefire-reports/"
      - "**/target/site/jacoco/"
    expire_in: 7 days

# ============================================
# Job 2：共通 Python 服務靜態檢查與 Pytest
# ============================================
python-verify:
  stage: test
  image: python:3.11-slim@sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60
  needs:
    - job: impact-scope
      artifacts: true
  script:
    - bash scripts/ci/verify_python.sh
  artifacts:
    when: always
    reports:
      junit:
        - "backend-ai-py/test-results/junit.xml"
    paths:
      - "backend-ai-py/test-results/junit.xml"
    expire_in: 7 days

# ============================================
# Job 3：共通 Java Testcontainers 端到端整合測試 (自動執行門禁)
# ============================================
testcontainers-integration:
  stage: integration
  image: maven:3.9.8-eclipse-temurin-21@sha256:de18e4e51396ad9266f76669779ed6d6b49fbb0f45ed6f39169d87378d548d7d
  needs:
    - job: impact-scope
      artifacts: true
    - job: java-unit-test
      artifacts: false
    - job: python-verify
      artifacts: false
    - job: portainer-deploy-contract-test
      artifacts: false
  variables:
    DOCKER_API_VERSION: "1.44"
    TESTCONTAINERS_HOST_OVERRIDE: "${TESTCONTAINERS_HOST_OVERRIDE:-172.17.0.1}"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    MAVEN_OPTS: "-Dmaven.repo.local=/root/.m2 -Xms512m -Xmx2048m -XX:+UseG1GC"
  allow_failure: false
  script:
    - bash scripts/ci/verify_java_integration.sh
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/failsafe-reports/*.xml"
    paths:
      - "**/target/failsafe-reports/"
    expire_in: 7 days

# ============================================
# Job 4：全量微服務 Docker Image 建置
# ============================================
docker-images-build:
  stage: package
  image: docker:27-cli
  resource_group: backend-image-build
  needs:
    - job: impact-scope
      artifacts: true
    - job: java-unit-test
      artifacts: false
    - job: python-verify
      artifacts: false
    - job: testcontainers-integration
      artifacts: false
    - job: portainer-deploy-contract-test
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: manual
      allow_failure: true
  script:
    - test -n "${IMPACT_HEAD_SHA:-}" && test "${IMPACT_HEAD_SHA}" = "${CI_COMMIT_SHA}" || { echo "影響判定 SHA 與建置 SHA 不一致，拒絕建置映像"; exit 1; }
    - echo "===> Building all microservice Docker images with --no-cache (Gateway + 5 microservices)..."
    - docker compose --project-directory . -p backend-architecture-lab -f docker/compose/prototype.yaml build --no-cache
    - |
      # 避免不同 Pipeline 的 latest 標籤互相覆蓋部署版本。
      for SERVICE in gateway iam-service competency-service job-service external-api-service alert-service; do
        docker tag "backend-architecture-lab-${SERVICE}:latest" "backend-architecture-lab-${SERVICE}:${CI_COMMIT_SHA}"
      done
    - docker images | grep backend-architecture-lab-
  after_script:
    # --no-cache 不會自動刪除新快取；成功、失敗或取消後皆嘗試清理。
    # 僅清理 default builder 未使用的快取，不刪服務映像、容器或資料卷。
    - docker buildx prune --builder default --all --force

# ============================================
# Job 5：透過 Portainer 更新既有 Stack
# ============================================
deploy-cluster:
  stage: deploy
  image: docker:27-cli
  resource_group: backend-production
  needs:
    - job: impact-scope
      artifacts: true
    - job: docker-images-build
      artifacts: false
  environment:
    name: production
  variables:
    PORTAINER_STACK_NAME: backend-managed
    PORTAINER_ENDPOINT_ID: "3"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PORTAINER_DEPLOY_ENABLED == "true"'
    - when: never
  before_script:
    - apk add --no-cache curl jq git
    - test -n "${IMPACT_HEAD_SHA:-}" && test "${IMPACT_HEAD_SHA}" = "${CI_COMMIT_SHA}" || { echo "影響判定 SHA 與部署 SHA 不一致，拒絕部署"; exit 1; }
  script:
    - |
      set -eu
      umask 077
      : "${PORTAINER_API_URL:?請設定結尾為 /api 的 Portainer 網址}"
      : "${PORTAINER_API_KEY:?請設定受保護且遮罩的專用 API Token}"
      API_URL="${PORTAINER_API_URL%/}"
      WORK_DIR=$(mktemp -d)
      trap 'rm -rf "$WORK_DIR"' EXIT

      # 拒絕落後主分支的 Pipeline，避免舊版本排隊後覆蓋新版本。
      CURRENT_SHA=$(git ls-remote "$CI_REPOSITORY_URL" "refs/heads/$CI_DEFAULT_BRANCH" | awk '{print $1}')
      test "$CURRENT_SHA" = "$CI_COMMIT_SHA" || { echo "提交已不是主分支最新版本，拒絕部署"; exit 1; }

      curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
        -H "X-API-Key: $PORTAINER_API_KEY" "$API_URL/stacks" > "$WORK_DIR/stacks.json"
      STACK_ID=$(jq -er --arg name "$PORTAINER_STACK_NAME" --argjson endpoint "$PORTAINER_ENDPOINT_ID" \
        '[.[] | select(.Name == $name and .EndpointId == $endpoint and .Type == 2 and .Status == 1)] | if length == 1 then .[0].Id else error("需要唯一且啟用的 Compose Stack") end' "$WORK_DIR/stacks.json")
      STACK_ENV=$(jq -c --argjson id "$STACK_ID" '.[] | select(.Id == $id) | .Env // []' "$WORK_DIR/stacks.json")
      curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
        -H "X-API-Key: $PORTAINER_API_KEY" "$API_URL/stacks/$STACK_ID/file" \
        -o "$WORK_DIR/file.json"
      jq -er '.StackFileContent' "$WORK_DIR/file.json" > "$WORK_DIR/stack.json"

      # 接管 Stack 使用 JSON（合法 YAML）；只改六個應用映像。
      jq -e '.services | type == "object"' "$WORK_DIR/stack.json" >/dev/null
      # Portainer 內的 Stack 檔不一定含 healthcheck，需補上，否則容器 Up 但應用啟動失敗會被誤判成功。
      jq -e '.services.gateway.healthcheck = {
          test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3"],
          interval: "10s", timeout: "5s", retries: 6, start_period: "60s"
        }' "$WORK_DIR/stack.json" > "$WORK_DIR/next.json"
      mv "$WORK_DIR/next.json" "$WORK_DIR/stack.json"
      for SERVICE in gateway iam-service competency-service job-service external-api-service alert-service; do
        IMAGE="backend-architecture-lab-${SERVICE}:${CI_COMMIT_SHA}"
        docker image inspect "$IMAGE" >/dev/null
        jq -e --arg service "$SERVICE" --arg image "$IMAGE" \
          'if .services[$service] then .services[$service].image = $image else error("缺少應用服務") end' \
          "$WORK_DIR/stack.json" > "$WORK_DIR/next.json"
        mv "$WORK_DIR/next.json" "$WORK_DIR/stack.json"
      done
      jq -n --rawfile content "$WORK_DIR/stack.json" --argjson env "$STACK_ENV" \
        '{StackFileContent: $content, Env: $env, Prune: false, PullImage: false}' > "$WORK_DIR/request.json"
      # 不重試寫入：API 逾時可能已接受部署，必須先確認實際狀態。
      curl --fail --silent --show-error --connect-timeout 10 --max-time 180 \
        -X PUT -H "X-API-Key: $PORTAINER_API_KEY" -H 'Content-Type: application/json' \
        --data-binary "@$WORK_DIR/request.json" \
        "$API_URL/stacks/$STACK_ID?endpointId=$PORTAINER_ENDPOINT_ID" > "$WORK_DIR/result.json"

      # 驗證實際映像及健康狀態，不以 API 接受請求直接判定成功。
      for SERVICE in gateway iam-service competency-service job-service external-api-service alert-service; do
        EXPECTED_ID=$(docker image inspect -f '{{.Id}}' "backend-architecture-lab-${SERVICE}:${CI_COMMIT_SHA}")
        READY=false
        for ATTEMPT in $(seq 1 60); do
          if docker inspect "backend-architecture-lab-$SERVICE" > "$WORK_DIR/container.json" 2>/dev/null && \
            jq -e --arg image "$EXPECTED_ID" --arg stack "$PORTAINER_STACK_NAME" --arg service "$SERVICE" \
              '.[0] | .Image == $image and .Config.Labels["com.docker.compose.project"] == $stack and .State.Running == true and (if $service == "gateway" then .State.Health.Status == "healthy" else (.State.Health.Status // "healthy") == "healthy" end)' \
              "$WORK_DIR/container.json" >/dev/null; then
            READY=true
            break
          fi
          sleep 3
        done
        test "$READY" = true || { echo "$SERVICE 未在期限內完成更新"; exit 1; }
      done
      for SERVICE in postgres redis nacos loki; do
        test "$(docker inspect -f '{{.State.Health.Status}}' "backend-architecture-lab-$SERVICE")" = healthy
      done
    - docker ps --filter "name=backend-architecture-lab-"
    - echo "===> Portainer Stack application update verified."
