services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:lts-community}
    container_name: ${SONARQUBE_CONTAINER_NAME:-backend-architecture-lab-sonarqube}
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${SONARQUBE_PORT:-9000}:9000"
      - "${ALLOW_HOST:-127.0.0.2}:${SONARQUBE_PORT:-9000}:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube_network

networks:
  sonarqube_network:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
