server:
  port: 8007
  max-http-request-header-size: 64KB
spring:
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/external_api_service
    username: postgres
    password: verYs3cret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  application:
    name: external-api-service
  autoconfigure:
    exclude:
      - com.linecorp.bot.spring.boot.LineBotWebMvcAutoConfiguration
      - com.linecorp.bot.spring.boot.LineBotHandlerAutoConfiguration
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          ai-py-service:
            connect-timeout: 5000
            read-timeout: 300000
          gpt-sovit-client:
            connect-timeout: 5000
            read-timeout: 300000
    nacos:
      discovery:
        server-addr: localhost:8848
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    model: gemini-2.0-flash
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/chat/completions
    model: deepseek-v4-flash
groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile
github:
  models:
    api:
      key: ${GITHUB_MODELS_API_KEY:}
      url: https://models.inference.ai.azure.com/chat/completions
      model: gpt-4o-mini
ai:
  whisper:
    model-path: ${WHISPER_MODEL_PATH:models/ggml-large-v3-turbo.bin}
    suppress-non-speech-tokens: ${WHISPER_SUPPRESS_NON_SPEECH_TOKENS:true}
    logprob-thold: ${WHISPER_LOGPROB_THOLD:0.0}
    no-speech-thold: ${WHISPER_NO_SPEECH_THOLD:0.1}
    temperature-inc: ${WHISPER_TEMPERATURE_INC:0.0}
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ai-audio}

line:
  bot:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
  gf:
    channel-secret: ${LINE_GF_CHANNEL_SECRET:}
    channel-token: ${LINE_GF_CHANNEL_ACCESS_TOKEN:}
  diary:
    channel-secret: ${LINE_DIARY_CHANNEL_SECRET:}
    channel-token: ${LINE_DIARY_CHANNEL_ACCESS_TOKEN:}

discord:
  gf:
    token: ${DISCORD_GF_TOKEN:}
  diary:
    token: ${DISCORD_DIARY_TOKEN:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 120s
        sliding-window-size: 5
    instances:
      pythonSttClient:
        base-config: default
      gptSoVitClient:
        base-config: default
      ai-py-service:
        base-config: default
  bulkhead:
    instances:
      pythonSttClient:
        max-concurrent-calls: 3
        max-wait-duration: 30s

jwt:
  secret:
    use: ${JWT_SECRET_USE:qBTBqz3r/8hW+a1/KPkqQMgWfQTW3vw7E5+HKx4Vru4=}
  issuer: ${JWT_ISSUER:BackendArchitectureLab}
  audience: ${JWT_AUDIENCE:BackendArchitectureLab}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
