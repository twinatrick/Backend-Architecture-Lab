server:
  port: 8007
  max-http-request-header-size: 64KB
spring:
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/external_api_service}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:verYs3cret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
  application:
    name: external-api-service
  autoconfigure:
    exclude:
      - com.linecorp.bot.spring.boot.LineBotWebMvcAutoConfiguration
      - com.linecorp.bot.spring.boot.LineBotHandlerAutoConfiguration
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          ai-py-service:
            connect-timeout: 5000
            read-timeout: 300000
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:${NACOS_SERVER_ADDR:localhost:8848}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

ai:
  py:
    service:
      url: ${AI_PY_SERVICE_URL:${AI_PY_URL:http://localhost:5001}}
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent
    model: gemini-3.7-flash
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/chat/completions
    model: deepseek-v4-flash
groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile
github:
  models:
    api:
      key: ${GITHUB_MODELS_API_KEY:}
      url: https://models.inference.ai.azure.com/chat/completions
      model: gpt-4o-mini
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_USER:minioadmin}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_PASSWORD:minioadmin}}
  bucket: ${MINIO_BUCKET:audio}
  stt-bucket: ${MINIO_STT_BUCKET:user-audio}

stt:
  providers:
    whisper:
      enabled: true
    sensevoice:
      enabled: false

line:
  bot:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
  gf:
    channel-secret: ${LINE_GF_CHANNEL_SECRET:}
    channel-token: ${LINE_GF_CHANNEL_ACCESS_TOKEN:}
  diary:
    channel-secret: ${LINE_DIARY_CHANNEL_SECRET:}
    channel-token: ${LINE_DIARY_CHANNEL_ACCESS_TOKEN:}

discord:
  gf:
    token: ${DISCORD_GF_TOKEN:}
  diary:
    token: ${DISCORD_DIARY_TOKEN:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 120s
        sliding-window-size: 5
    instances:
      pythonSttClient:
        base-config: default
      ai-py-service:
        base-config: default
  bulkhead:
    instances:
      pythonSttClient:
        max-concurrent-calls: 3
        max-wait-duration: 30s

jwt:
  secret:
    use: ${JWT_SECRET_USE:qBTBqz3r/8hW+a1/KPkqQMgWfQTW3vw7E5+HKx4Vru4=}
  issuer: ${JWT_ISSUER:BackendArchitectureLab}
  audience: ${JWT_AUDIENCE:BackendArchitectureLab}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

cache:
  bloom-filter:
    entities:
      - "UserVoiceUpload:userVoiceUploads"
      - "VoiceTranslation:voiceTranslations"

logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
