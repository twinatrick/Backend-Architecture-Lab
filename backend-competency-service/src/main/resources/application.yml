server:
  port: 8004
  max-http-request-header-size: 64KB
spring:
  application:
    name: competency-service
  datasource:
    url: jdbc:postgresql://localhost:5432/competency_service
    username: postgres
    password: verYs3cret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
  kafka:
    bootstrap-servers: localhost:9092
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
jwt:
  secret:
    use: ${JWT_SECRET_USE:qBTBqz3r/8hW+a1/KPkqQMgWfQTW3vw7E5+HKx4Vru4=}
  issuer: ${JWT_ISSUER:BackendArchitectureLab}
  audience: ${JWT_AUDIENCE:BackendArchitectureLab}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

cache:
  bloom-filter:
    entities:
      - "Skill:skills"

app:
  internal:
    # 內網端點（/project/inner/**）共享 token，fail-closed：未設定時一律 401。
    # 生產環境必須以環境變數 APP_INTERNAL_TOKEN 設定（secret manager 管理）。
    token: ${APP_INTERNAL_TOKEN:}

external-sync:
  # 外部系統同步 adapter：預設未啟用（尚未接線真實外部系統）。
  # 啟用時必須設定 base-url，否則啟動 fail-fast；同步命令（external_sync_command）
  # 由 ExternalSyncWorker 可靠執行，重試耗盡（DEAD）才觸發補償閉環。
  enabled: ${EXTERNAL_SYNC_ENABLED:false}
  base-url: ${EXTERNAL_SYNC_BASE_URL:}
  max-attempts: 5
  lease-seconds: 300
  batch-size: 20
  backoff-seconds: 5,15,30,60,300
  flush-delay-ms: 5000

compensation:
  consumer:
    lease-seconds: 300
    max-attempts: 5
    retry-backoff-ms: 60000
    reclaim-delay-ms: 60000
