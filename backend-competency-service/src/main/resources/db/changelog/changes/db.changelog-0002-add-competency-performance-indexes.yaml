databaseChangeLog:
  - changeSet:
      id: 0002-add-competency-performance-indexes
      author: performance-review
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_project_created_time_id ON project (created_time DESC, id ASC);
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_skill_created_time_id ON skill (created_time DESC, id ASC);
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_skill_level_created_time_id ON skill_level (created_time DESC, id ASC);

  - changeSet:
      id: 0002-02-add-competency-composite-indexes
      author: performance-review
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_user_project_project_user ON user_project (project_id, user_id);

  - changeSet:
      id: 0002-03-add-competency-trgm-gin-indexes
      author: performance-review
      dbms: postgresql
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_project_name_trgm ON project USING gin (LOWER(name) gin_trgm_ops);
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_skill_name_trgm ON skill USING gin (LOWER(name) gin_trgm_ops);
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_skill_level_title_trgm ON skill_level USING gin (LOWER(title) gin_trgm_ops);
