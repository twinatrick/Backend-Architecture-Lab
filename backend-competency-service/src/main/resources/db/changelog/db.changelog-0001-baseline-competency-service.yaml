              - column:
                  name: created_time
                  type: timestamp
              - column:
                  name: updated_time
                  type: timestamp
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(255)

  - changeSet:
      id: 0001-03-create-skill-level
      author: architecture-lab
      comment: 建立技能等級實體表 (skill_level)
      changes:
        - createTable:
            tableName: skill_level
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: created_time
                  type: timestamp
              - column:
                  name: updated_time
                  type: timestamp
              - column:
                  name: skill_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: level_value
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: skill_level
            baseColumnNames: skill_id
            constraintName: fk_skill_level_skill_id
            referencedTableName: skill
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: skill_level
            columnNames: skill_id, level_value
            constraintName: uq_skill_level_skill_value
        - createIndex:
            tableName: skill_level
            indexName: idx_skill_level_skill_id
            columns:
              - column:
                  name: skill_id

