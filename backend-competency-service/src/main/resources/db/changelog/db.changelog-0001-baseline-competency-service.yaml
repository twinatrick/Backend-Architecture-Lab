              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: ${text.type}
                  constraints:
                    nullable: false
              - column:
                  name: delivery_status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: processing_at
                  type: timestamp
              - column:
                  name: lease_until
                  type: timestamp
              - column:
                  name: attempt_count
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: timestamp
              - column:
                  name: sent_at
                  type: timestamp
              - column:
                  name: owner_id
                  type: varchar(64)
              - column:
                  name: fencing_version
                  type: bigint
              - column:
                  name: error_message
                  type: varchar(1024)
              - column:
                  name: last_alerted_at
