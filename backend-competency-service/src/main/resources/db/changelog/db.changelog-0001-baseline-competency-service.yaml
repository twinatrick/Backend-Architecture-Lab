databaseChangeLog:
  - property:
      name: text.type
      value: varchar(65535)
      dbms: h2
  - property:
      name: text.type
      value: text
      dbms: postgresql

  - changeSet:
      id: 0001-01-create-project
      author: architecture-lab
      comment: 建立專案實體表 (project)
      changes:
        - createTable:
            tableName: project
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: created_time
                  type: timestamp
              - column:
                  name: updated_time
                  type: timestamp
              - column:
                  name: version
                  type: bigint
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(255)

  - changeSet:
      id: 0001-02-create-skill
      author: architecture-lab
      comment: 建立技能實體表 (skill)
      changes:
        - createTable:
            tableName: skill
            columns:
              - column:
                  name: id
