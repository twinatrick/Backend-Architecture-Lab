name: backend-ai-py
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core infrastructure: conda channel
  - fastapi
  - uvicorn
  - python-multipart
  - httpx
  - requests
  - pydantic-settings
  - av

  # pip-only / unavailable on conda-forge
  - pip:
    - faster-whisper
    - sherpa-onnx
    - soundfile
    - minio
    - nacos-sdk-python==2.0.11  # 3.x API 全面改版（無 NacosClient），鎖定 2.x 以相容 main.py
    - opencc
    - numpy  # 必須用 pip 版（openblas 後端）：conda 版（mkl BLAS）在 Windows 執行 BLAS 運算會崩潰（0xC06D007F，av 依賴會自動拉入 conda 版）
