databaseChangeLog:
  - changeSet:
      id: 0001-01-create-alert-check-limit
      author: opencode
      changes:
        - createTable:
            tableName: alert_check_limit
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: created_time
                  type: timestamp
              - column:
                  name: updated_time
                  type: timestamp
              - column:
                  name: table_name
                  type: varchar(255)
              - column:
                  name: column_name
                  type: varchar(255)
              - column:
                  name: limit_value
                  type: double
  - changeSet:
      id: 0001-02-create-aquark-data
      author: opencode
      changes:
        - createTable:
            tableName: aquark_data
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: created_time
                  type: timestamp
              - column:
                  name: updated_time
                  type: timestamp
              - column:
                  name: station_id
                  type: varchar(255)
              - column:
                  name: csq
                  type: varchar(255)
              - column:
                  name: trans_time
                  type: timestamp
              - column:
                  name: rain_d
                  type: real
              - column:
                  name: moisture
                  type: real
              - column:
                  name: temperature
                  type: real
              - column:
                  name: echo
                  type: real
              - column:
                  name: water_speed_aquark
                  type: real
              - column:
                  name: is_peak
                  type: boolean
              - column:
                  name: v1
                  type: real
              - column:
                  name: v2
                  type: real
              - column:
                  name: v3
                  type: real
              - column:
                  name: v4
                  type: real
              - column:
                  name: v5
                  type: real
              - column:
                  name: v6
                  type: real
              - column:
                  name: v7
                  type: real
