server:
  port: 8000
  max-http-request-header-size: 64KB
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/role/**,/api/function/**
          filters:
            - StripPrefix=1

        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/job-posting/**,/api/company/**,/api/user-job-link/**,/api/user/bindings/job/**
          filters:
            - StripPrefix=1

        - id: competency-service
          uri: lb://competency-service
          predicates:
            - Path=/api/skill/**,/api/project/**,/api/user/bindings/**
          filters:
            - StripPrefix=1

        - id: external-api-service
          uri: lb://external-api-service
          predicates:
            - Path=/api/stt/**,/api/ai/**,/api/external/**
          filters:
            - StripPrefix=1

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alertCheckLimit/**,/api/aquarkData/**
          filters:
            - StripPrefix=1

        - id: cache-stats
          uri: lb://alert-service
          predicates:
            - Path=/api/cache-stats
          filters:
            - StripPrefix=1

        - id: iam-api-docs
          uri: lb://iam-service
          predicates:
            - Path=/service-docs/iam/**
          filters:
            - StripPrefix=2

        - id: competency-api-docs
          uri: lb://competency-service
          predicates:
            - Path=/service-docs/competency/**
          filters:
            - StripPrefix=2

        - id: job-api-docs
          uri: lb://job-service
          predicates:
            - Path=/service-docs/job/**
          filters:
            - StripPrefix=2

        - id: external-api-docs
          uri: lb://external-api-service
          predicates:
            - Path=/service-docs/external-api/**
          filters:
            - StripPrefix=2

        - id: alert-api-docs
          uri: lb://alert-service
          predicates:
            - Path=/service-docs/alert/**
          filters:
            - StripPrefix=2

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

springdoc:
  swagger-ui:
    url: /v3/api-docs-merged
