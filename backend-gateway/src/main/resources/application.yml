server:
  port: 8000
  max-http-request-header-size: 64KB
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}}
    gateway:
      routes:
        - id: ai-py-health
          uri: ${AI_PY_URL:http://host.docker.internal:5001}
          predicates:
            - Path=/api/ai-py/health
          filters:
            - SetPath=/health

        - id: ai-py-service
          uri: ${AI_PY_URL:http://host.docker.internal:5001}
          predicates:
            - Path=/api/ai-py/**,/api/stt/**,/api/tts/**,/api/chat/**
          filters:
            - StripPrefix=1

        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/role/**,/api/function/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: iamCircuitBreaker
                fallbackUri: forward:/fallback

        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/job-posting/**,/api/company/**,/api/user-job-link/**,/api/user/bindings/job/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: jobCircuitBreaker
                fallbackUri: forward:/fallback

        - id: competency-service
          uri: lb://competency-service
          predicates:
            - Path=/api/skill/**,/api/project/**,/api/user/bindings/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: competencyCircuitBreaker
                fallbackUri: forward:/fallback

        - id: external-api-service
          uri: lb://external-api-service
          predicates:
            - Path=/api/stt/**,/api/ai/**,/api/external/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: externalApiCircuitBreaker
                fallbackUri: forward:/fallback

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alertCheckLimit/**,/api/aquarkData/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: alertCircuitBreaker
                fallbackUri: forward:/fallback

        - id: cache-stats
          uri: lb://alert-service
          predicates:
            - Path=/api/cache-stats
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: alertCircuitBreaker
                fallbackUri: forward:/fallback

        - id: iam-api-docs
          uri: lb://iam-service
          predicates:
            - Path=/service-docs/iam/**
          filters:
            - StripPrefix=2

        - id: competency-api-docs
          uri: lb://competency-service
          predicates:
            - Path=/service-docs/competency/**
          filters:
            - StripPrefix=2

        - id: job-api-docs
          uri: lb://job-service
          predicates:
            - Path=/service-docs/job/**
          filters:
            - StripPrefix=2

        - id: external-api-docs
          uri: lb://external-api-service
          predicates:
            - Path=/service-docs/external-api/**
          filters:
            - StripPrefix=2

        - id: alert-api-docs
          uri: lb://alert-service
          predicates:
            - Path=/service-docs/alert/**
          filters:
            - StripPrefix=2

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

springdoc:
  swagger-ui:
    url: /v3/api-docs-merged

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
