server:
  port: 8006
  max-http-request-header-size: 64KB
spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:5432/job_service
    username: postgres
    password: verYs3cret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
  kafka:
    bootstrap-servers: localhost:9092
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
jwt:
  secret:
    use: ${JWT_SECRET_USE:qBTBqz3r/8hW+a1/KPkqQMgWfQTW3vw7E5+HKx4Vru4=}
  issuer: ${JWT_ISSUER:BackendArchitectureLab}
  audience: ${JWT_AUDIENCE:BackendArchitectureLab}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

cache:
  bloom-filter:
    entities:
      - "Company:companies"
      - "JobPosting:jobPostings"
      - "UserJobLink:userJobLinks"
