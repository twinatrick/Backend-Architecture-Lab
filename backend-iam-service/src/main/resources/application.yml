server:
  port: 8002

spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: verYs3cret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
