server:
  port: 8004
  max-http-request-header-size: 64KB
spring:
  application:
    name: project-skill-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: verYs3cret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
