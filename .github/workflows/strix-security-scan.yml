name: Strix AI Security Assessment

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      scan_type:
        description: "測試模式 (white-box / black-box / gray-box)"
        required: true
        default: "white-box"
        type: choice
        options:
          - white-box
          - black-box
          - gray-box
      scan_mode:
        description: "掃描深度 (quick / standard)"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
      target_url:
        description: "黑盒/灰盒測試目標 URL (例如 http://staging.example.com)"
        required: false
        default: ""
      auth_token:
        description: "灰盒測試用 Token (例如 Bearer eyJhbGciOi...)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  strix-scan:
    name: Autonomous Pentest & Vulnerability Validation
    runs-on: ubuntu-latest
    environment: apikey
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Strix CLI (Pinned Release)
        run: |
          python -m pip install --upgrade pip
          pip install strix-agent==1.5.3

      - name: Pre-pull Strix Sandbox Docker Image
        run: docker pull ghcr.io/usestrix/strix-sandbox:1.3.0

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'gemini/gemini-3.6-flash' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEY_1 }}
          SCAN_TYPE: ${{ inputs.scan_type || 'white-box' }}
          SCAN_MODE: ${{ inputs.scan_mode || 'quick' }}
          TARGET_URL: ${{ inputs.target_url || '' }}
          AUTH_TOKEN: ${{ inputs.auth_token || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          strix --version

          if [ -n "$AUTH_TOKEN" ]; then
            echo "::add-mask::$AUTH_TOKEN"
          fi

          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY is not configured in secrets. Skipping security scan."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Running diff-scoped white-box review on PR changes..."
            strix -n --target ./ --scan-mode quick --scope-mode diff --diff-base "origin/$BASE_REF"
          elif [ "$SCAN_TYPE" = "black-box" ]; then
            if [ -z "$TARGET_URL" ]; then
              echo "Error: target_url is required for black-box scan"
              exit 1
            fi
            echo "Running black-box penetration testing on target: $TARGET_URL..."
            strix -n --target "$TARGET_URL" --scan-mode "$SCAN_MODE"
          elif [ "$SCAN_TYPE" = "gray-box" ]; then
            if [ -z "$TARGET_URL" ]; then
              echo "Error: target_url is required for gray-box scan"
              exit 1
            fi
            echo "Running authenticated gray-box penetration testing on target: $TARGET_URL..."
            if [ -n "$AUTH_TOKEN" ]; then
              strix -n --target "$TARGET_URL" --scan-mode "$SCAN_MODE" --instruction "Use Bearer JWT token for authentication: $AUTH_TOKEN"
            else
              strix -n --target "$TARGET_URL" --scan-mode "$SCAN_MODE" --instruction "Probe authenticated flows, signup, login and IDOR vulnerabilities"
            fi
          else
            echo "Running full white-box repository assessment..."
            strix -n --target ./ --scan-mode "$SCAN_MODE"
          fi

      - name: Upload Strix Findings & Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: strix-findings
          path: strix_runs/
          if-no-files-found: ignore
