name: Strix AI Security Assessment

on:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      scan_type:
        description: "測試模式 (white-box / black-box / gray-box)"
        required: true
        default: "white-box"
        type: choice
        options:
          - white-box
          - black-box
          - gray-box
      scan_mode:
        description: "掃描深度 (quick / standard)"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
      target_url:
        description: "黑盒/灰盒測試目標 URL (例如 http://staging.example.com)"
        required: false
        default: ""
      auth_token:
        description: "灰盒測試用 Token (例如 Bearer eyJhbGciOi...)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  strix-scan:
    name: Autonomous Pentest & Vulnerability Validation
    runs-on: ubuntu-latest
    environment: apikey
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Strix CLI
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH

      - name: Pre-pull Strix Sandbox Docker Image
        run: docker pull ghcr.io/usestrix/strix-sandbox:1.3.0

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'gemini/gemini-2.5-pro' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEY_1 }}
        run: |
          export PATH="$HOME/.strix/bin:$PATH"
          strix --version

          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY is not configured in secrets. Skipping security scan."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running diff-scoped white-box review on PR changes..."
            strix -n --target ./ --scan-mode quick --scope-mode diff --diff-base origin/${{ github.base_ref || 'master' }}
          elif [ "${{ inputs.scan_type }}" = "black-box" ]; then
            echo "Running black-box penetration testing on target: ${{ inputs.target_url }}..."
            strix -n --target "${{ inputs.target_url }}" --scan-mode "${{ inputs.scan_mode }}"
          elif [ "${{ inputs.scan_type }}" = "gray-box" ]; then
            echo "Running authenticated gray-box penetration testing on target: ${{ inputs.target_url }}..."
            if [ -n "${{ inputs.auth_token }}" ]; then
              strix -n --target "${{ inputs.target_url }}" --auth-token "${{ inputs.auth_token }}" --scan-mode "${{ inputs.scan_mode }}"
            else
              strix -n --target "${{ inputs.target_url }}" --scan-mode "${{ inputs.scan_mode }}" --instruction "Probe authenticated flows, signup, login and IDOR vulnerabilities"
            fi
          else
            echo "Running full white-box repository assessment..."
            strix -n --target ./ --scan-mode "${{ inputs.scan_mode }}"
          fi

      - name: Upload Strix Findings & Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: strix-findings
          path: strix_runs/
          if-no-files-found: ignore
