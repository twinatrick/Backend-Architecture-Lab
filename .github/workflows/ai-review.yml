name: AI Architecture & Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    name: Prepare Review Batches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build semantic batches
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/*' ':(exclude)*.lock' ':(exclude)*.json' > changed-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [x.strip() for x in Path('changed-files.txt').read_text().splitlines() if x.strip()]
          groups = {k: [] for k in ('security-api','business','data','integration','python','other')}

          for f in files:
              p = f.lower()
              if p.endswith('.py'):
                  groups['python'].append(f)
              elif any(x in p for x in ('controller','security','permission','auth','openapi')):
                  groups['security-api'].append(f)
              elif any(x in p for x in ('feign','client','integration','external')):
                  groups['integration'].append(f)
              elif any(x in p for x in ('repository','entity','dao','migration','mapper')):
                  groups['data'].append(f)
              elif any(x in p for x in ('service','domain','usecase')):
                  groups['business'].append(f)
              else:
                  groups['other'].append(f)

          batches = []
          for name, paths in groups.items():
              if paths:
                  batches.append({'name': name, 'files': paths})
          if not batches:
              batches = [{'name': 'other', 'files': []}]

          # Prevent a single semantic batch from becoming an oversized request.
          max_files = 12
          chunks = []
          for batch in batches:
              paths = batch['files']
              for i in range(0, len(paths), max_files):
                  part = paths[i:i + max_files]
                  suffix = '' if len(paths) <= max_files else f'-{i // max_files + 1}'
                  chunks.append({'name': batch['name'] + suffix, 'scope': batch['name'], 'files': part})

          Path('matrix.json').write_text(json.dumps({'include': chunks}, ensure_ascii=False))
          print(Path('matrix.json').read_text())
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: review-manifest
          path: changed-files.txt

  review:
    name: AI Review - ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: apikey
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run scoped review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BATCH_NAME: ${{ matrix.name }}
          BATCH_SCOPE: ${{ matrix.scope }}
          BATCH_FILES: ${{ join(matrix.files, '\n') }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          import requests

          key = os.environ.get('GROQ_API_KEY')
          if not key:
              sys.exit('GROQ_API_KEY is not configured.')

          rules = Path('開發規範.md').read_text(encoding='utf-8')
          contract = Path('.github/AI_REVIEW.md').read_text(encoding='utf-8')
          scope = os.environ['BATCH_SCOPE']
          files = [x for x in os.environ['BATCH_FILES'].splitlines() if x]

          # Each agent receives only a compact, relevant rule subset.
          keywords = {
              'security-api': ('BOLA','權限','OpenAPI','Controller','IAM','Security','API'),
              'business': ('SOLID','DRY','KISS','YAGNI','Service','架構'),
              'data': ('Repository','Entity','DataAccess','資料庫','EntityManager','Entity'),
              'integration': ('Feign','跨服務','外部','Microservice','Client'),
              'python': ('Python','Ruff','Exception','Type Hint','snake_case'),
              'other': ('CI','規範','品質'),
          }
          terms = keywords[scope]
          selected = []
          lines = rules.splitlines()
          for i, line in enumerate(lines):
              if any(t.lower() in line.lower() for t in terms):
                  selected.extend(lines[max(0, i-2):min(len(lines), i+14)])
          relevant_rules = '\n'.join(dict.fromkeys(selected))[:14000]
          if not relevant_rules:
              relevant_rules = rules[:8000]

          cmd = ['git','diff','--unified=50',os.environ['BASE_SHA'],os.environ['HEAD_SHA'],'--',*files]
          diff = subprocess.run(cmd, capture_output=True, text=True, check=False).stdout
          diff = diff[:26000]

          prompt = f'''你是此 repository 的 Senior Code Reviewer，負責「{scope}」批次。

          【語言要求】
          所有自然語言輸出必須使用繁體中文（zh-TW）。禁止簡體中文。
          程式碼、類別、方法、Annotation、API 路徑與標準技術名詞可保留英文。

          【規則來源】
          開發規範.md 是唯一專案規則來源。

          【Review Contract】
          {contract[:9000]}

          【本批次相關規範】
          {relevant_rules}

          【本批次檔案】
          {chr(10).join(files)}

          【本批次 Diff】
          ```diff
          {diff}
          ```

          只審查本批次。優先檢查 Security、Authorization/BOLA、Architecture、Data Integrity、Functional Bug；再檢查 API、Permission、OpenAPI、SOLID/DRY/KISS/YAGNI 及語言規範。
          必須有程式碼證據才能提出 Finding。不得因與本 PR 無關的既有問題要求修改。不得提出純風格或無必要重構。

          只輸出合法 JSON，格式：
          {{
            "batch":"{os.environ['BATCH_NAME']}",
            "findings":[{{
              "severity":"CRITICAL|HIGH|MEDIUM|LOW",
              "confidence":"HIGH|MEDIUM|LOW",
              "blocking":true,
              "location":"file:line",
              "rule":"繁體中文規範依據",
              "problem":"繁體中文問題",
              "evidence":"繁體中文證據",
              "risk":"繁體中文風險",
              "recommendation":"繁體中文修正建議"
            }}],
            "passed_checks":["繁體中文"]
          }}
          '''

          r = requests.post(
              'https://api.groq.com/openai/v1/chat/completions',
              headers={'Authorization':f'Bearer {key}','Content-Type':'application/json'},
              json={'model':'llama-3.3-70b-versatile','messages':[{'role':'system','content':'你必須使用繁體中文。只輸出合法 JSON。不得捏造 Finding。'},{'role':'user','content':prompt}],'temperature':0.1},
              timeout=120,
          )
          r.raise_for_status()
          text = r.json()['choices'][0]['message']['content'].strip()
          if text.startswith('```'):
              text = text.split('\n',1)[1].rsplit('```',1)[0].strip()
          result = json.loads(text)
          Path(f'batch-{os.environ["BATCH_NAME"]}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-${{ matrix.name }}
          path: batch-${{ matrix.name }}.json
          if-no-files-found: ignore

  aggregate:
    name: Aggregate AI Review
    needs: [prepare, review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: ai-review-*
          path: batch-results
          merge-multiple: true

      - name: Aggregate findings and enforce gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          from pathlib import Path
          import requests

          findings=[]
          passed=[]
          failed_batches=[]
          for p in glob.glob('batch-results/batch-*.json'):
              try:
                  data=json.loads(Path(p).read_text(encoding='utf-8'))
                  findings.extend(data.get('findings',[]))
                  passed.extend(data.get('passed_checks',[]))
              except Exception as e:
                  failed_batches.append(f'{p}: {e}')

          # Deduplicate without trusting an AI-generated final decision.
          unique=[]; seen=set()
          for f in findings:
              key=(f.get('location'), f.get('problem'))
              if key not in seen:
                  seen.add(key); unique.append(f)

          blocking=[f for f in unique if f.get('blocking') is True and f.get('confidence')=='HIGH' and f.get('severity') in {'CRITICAL','HIGH'}]
          decision='REQUEST_CHANGES' if blocking else 'APPROVE'

          out=['# AI Code Review','',f'## 審查結果\n{decision}','',f'共 {len(unique)} 個 Finding；其中 {len(blocking)} 個為阻擋項目。','']
          if failed_batches:
              out += ['## Review Batch 執行問題','AI Review 批次未完整產生結果，因此本次 CI 不應視為完整通過。','']
          if not unique:
              out += ['## Findings','無。','']
          else:
              out += ['## Findings']
              for f in unique:
                  out += ['',f"### [{f.get('severity')}] {f.get('problem')}",f"**位置**：`{f.get('location')}`",f"**規範依據**：{f.get('rule')}",f"**證據**：{f.get('evidence')}",f"**風險**：{f.get('risk')}",f"**修正建議**：{f.get('recommendation')}",f"**信心度**：{f.get('confidence')} | **阻擋**：{f.get('blocking')}"]
          out += ['', '## 已通過檢查'] + [f'- {x}' for x in sorted(set(passed))]
          if failed_batches:
              out += ['', '## 批次錯誤'] + [f'- {x}' for x in failed_batches]
          report='\n'.join(out)
          Path('review.md').write_text(report,encoding='utf-8')
          Path('ai-review.json').write_text(json.dumps({'decision':decision,'findings':unique,'blocking_findings':blocking,'failed_batches':failed_batches},ensure_ascii=False,indent=2),encoding='utf-8')
          print(report)

          body=report+'\n\n<!-- ai-review-gate -->'
          url=f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"
          requests.post(url,headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json'},json={'body':body},timeout=30).raise_for_status()

          # A missing batch result is itself a CI failure. Do not silently approve a partial review.
          if failed_batches or decision=='REQUEST_CHANGES':
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-final
          path: |
            review.md
            ai-review.json
          if-no-files-found: ignore
