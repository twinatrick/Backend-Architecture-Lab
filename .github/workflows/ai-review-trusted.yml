name: AI Architecture & Security Review

# Trusted execution boundary:
# - Triggered by the same PR lifecycle as the other CI workflows.
# - Runs only the trusted workflow source from the default branch.
# - Never checks out or executes PR code; PR content is read through the GitHub API.
# - Secret-backed review is isolated from untrusted PR code.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: apikey
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Run trusted batch review and deterministic gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/ai-review/review.py

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-final
          path: |
            review.md
            ai-review.json
          if-no-files-found: ignore
