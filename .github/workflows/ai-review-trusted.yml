name: AI Architecture & Security Review

# Trusted execution boundary:
# - Triggered by the secret-free PR workflow.
# - Must live on the protected default branch before it is trusted with GROQ_API_KEY.
# - Never checks out or executes PR code; PR content is read through the GitHub API.

on:
  workflow_run:
    workflows: ["AI Review Trigger"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: apikey
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Run trusted batch review and deterministic gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/ai-review/review.py

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@11bd71901bbe5b1630ceea73d27597364c9af4e95f4bb
        with:
          name: ai-review-final
          path: |
            review.md
            ai-review.json
          if-no-files-found: ignore
