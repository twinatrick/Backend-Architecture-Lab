name: CI — Build, Test & Package

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  # ============================================
  # Job 1：Maven 編譯 + 測試 + 覆蓋率檢查
  # ============================================
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          # 帳戶快取傳出流量超額時會拖延還原；改由 Maven 直接下載依賴。

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build, Test & Check Coverage
        run: ./mvnw test jacoco:check

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: SonarQube Code Quality & Coverage Analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.login="${SONAR_TOKEN}"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-results
          path: target/surefire-reports/

  # ============================================
  # Job 1.2：Testcontainers 端到端整合測試
  # ============================================
  integration-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          # 與 build 一致，避免 Actions 快取還原耗盡整合測試時間。

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Testcontainers Integration Tests
        run: ./mvnw verify -Pintegration-test -Dsurefire.skip=true

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-test-results
          path: "**/target/failsafe-reports/"

  # 以獨立環境驗證正式依賴，避免開發或測試套件掩蓋啟動時缺少的套件。
  ai-review-runtime:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: 驗證乾淨環境的 AI Review 入口匯入
        run: |
          python -m venv "$RUNNER_TEMP/ai-review-runtime"
          "$RUNNER_TEMP/ai-review-runtime/bin/python" -m pip install --disable-pip-version-check -r .github/ai-review/requirements.txt
          "$RUNNER_TEMP/ai-review-runtime/bin/python" -I - <<'PY'
          import sys
          sys.path.insert(0, '.github/ai-review')
          import review
          import record_verdict
          print('AI Review runtime imports OK')
          PY

  # ============================================
  # Job 1.5：Python 服務驗證 (Ruff & Pytest)
  # ============================================
  python-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi pydantic-settings python-multipart requests av minio nacos-sdk-python==2.0.11 opencc soundfile numpy faster-whisper sherpa-onnx

      - name: Run Ruff Linter
        run: ruff check backend-ai-py

      - name: Run Ruff Formatter Check
        run: ruff format --check backend-ai-py

      - name: Run pytest
        run: |
          cd backend-ai-py
          pytest

  # ============================================
  # Job 2：Docker 映像建置（僅 tag push 或手動觸發）
  # ============================================
  docker:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, integration-test, python-verify]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514310cf821330a829b5da369d4379add1da # v3.10.0

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/backend-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
